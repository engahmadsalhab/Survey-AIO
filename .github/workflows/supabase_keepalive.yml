# GitHub Actions: يضرب مشروع Supabase بطلب خفيف كل 3 أيام حتى لا يتوقف
# مشروع الخطة المجانية بعد أسبوع من الخمول (البيانات لا تضيع عند التوقف،
# لكن هذه المهمة تجعل التوقف لا يحدث أصلًا).
#
# الإعداد مرة واحدة:
#   1) ارفع هذا الملف إلى: .github/workflows/supabase_keepalive.yml داخل مستودعك
#   2) من إعدادات المستودع: Settings → Secrets and variables → Actions
#      أنشئ سرين:
#        SUPABASE_URL       = https://xxxxxxxx.supabase.co
#        SUPABASE_ANON_KEY  = مفتاح anon (لا تضع service_role أبدًا)
#   3) شغّل يدويًا مرة من تبويب Actions للتأكد (Run workflow)

name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 3 */3 * *"   # كل 3 أيام الساعة 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::warning::تعذر الوصول إلى Supabase — تحقق من SUPABASE_URL"
          fi
